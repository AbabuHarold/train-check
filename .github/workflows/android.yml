name: Android APK

on:
  push:
    paths: ['android/**', 'shared/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Android SDK は GitHub のランナーに最初から入っているので、そのまま使う
      - name: Android SDK の場所
        run: echo "ANDROID_HOME=$ANDROID_HOME" && echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: 時刻表をアプリに同梱
        run: cp shared/timetable.json android/app/src/main/assets/timetable.json
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: train-check-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
