<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電車チェック</title>
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --text: #1b1f1d; --sub: #5d6661; --line: #e1e4df;
    --accent: #1f6f5c; --accent-weak: #e2f0eb; --warn: #b4540a; --danger: #c0352b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121614; --card: #1c211f; --text: #eef1ee; --sub: #9aa59f; --line: #2c3330;
      --accent: #5cc4a6; --accent-weak: #1f3a32; --warn: #f0a050; --danger: #ff7b6e; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Noto Sans JP", "Hiragino Sans", sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); max-width: 520px; margin: 0 auto; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 12px;
    padding: 12px 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .tab[aria-selected="true"] { color: #08130f; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .meta { color: var(--sub); font-size: 13px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .next { margin-top: 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .next .time { font-size: 56px; font-weight: 750; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1; }
  .next .suffix { font-size: 18px; color: var(--sub); }
  .badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-weak); color: var(--accent); }
  .leave { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--accent-weak); font-size: 17px; }
  .leave b { font-size: 30px; font-variant-numeric: tabular-nums; }
  .leave.soon { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .leave.now { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
  .arrive { margin-top: 8px; color: var(--sub); font-size: 14px; }
  h2 { font-size: 13px; color: var(--sub); font-weight: 600; margin: 20px 4px 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 10px;
    padding: 12px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  li:last-child { border-bottom: 0; }
  li .t { font-size: 20px; font-weight: 650; }
  li .r { color: var(--sub); font-size: 14px; text-align: right; }
  .walk { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; color: var(--sub); font-size: 14px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 18px; cursor: pointer; }
  .stepper span { min-width: 48px; text-align: center; color: var(--text); font-weight: 600; }
  .empty, .error { color: var(--sub); padding: 24px 4px; text-align: center; }
  .geo { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--sub); font-size: 13px; margin: 0 4px 10px; }
  .link { background: none; border: 0; color: var(--accent); font-size: 13px; font-weight: 600; padding: 6px 0; cursor: pointer; }
  li .r b { color: var(--text); font-weight: 600; }
  ol.legs { list-style: none; margin: 12px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--line); }
  ol.legs li { display: grid; grid-template-columns: 48px 1fr auto; gap: 8px; padding: 4px 0; border: 0; font-size: 14px; align-items: baseline; }
  ol.legs .lt { font-weight: 650; }
  ol.legs small { color: var(--sub); }
  ol.legs .ll { color: var(--sub); font-size: 12px; text-align: right; }
  footer { margin-top: 18px; color: var(--sub); font-size: 12px; text-align: center; }
</style>
</head>
<body>
  <div id="geo"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main"><p class="empty">読み込み中…</p></main>
  <footer id="foot"></footer>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
